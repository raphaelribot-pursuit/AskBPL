services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: askbpl
      POSTGRES_PASSWORD: askbpl_dev_password
      POSTGRES_DB: askbpl
    ports:
      # Host 5434 avoids conflict with local Postgres (5432) and other Docker DBs (5433)
      - "5434:5432"
    volumes:
      - askbpl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askbpl -d askbpl"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  askbpl_pgdata:
