# Ask BPL — Routing configuration (seed)
# Per TRD-RTG-2, RTG-3, RTG-4. Selvon approves the mapping before the June 15 demo.
# Multi-team owners are supported (e.g., conflict_of_interest -> two teams).

policy_types:
  materials_selection:
    owners:
      - "Materials Review Committee"
  unattended_children:
    owners:
      - "Public Service Policy Committee"
      - "Department of Public Safety"
  annual_leave:
    owners:
      - "Human Resources"
  conflict_of_interest:
    owners:
      - "General Counsel"
      - "Audit Committee"
  fundraising:
    owners:
      - "Development Office"
  volunteer_manual:
    owners:
      - "Office of Volunteer Resources"
  # Added for demo day — pending formal TRD-RTG-4 sign-off
  # IV. Public 1 — covers patron computer access, CIPA filtering, Wi-Fi
  technology_use:
    owners:
      - "Office of Technology"
    contact_hint: "Contact the Office of Technology"

  # Added for demo day — pending formal TRD-RTG-4 sign-off
  # HR12 — covers staff acceptable use of computers, email, internet, voicemail
  technology_usage_policy:
    owners:
      - "Office of Technology"
      - "Human Resources"
    contact_hint: "Contact the Office of Technology or your supervisor"

# Fallback per TRD-RTG-5: if a question maps to no known policy_type,
# route to the user's supervisor or the most appropriate general department.
fallback:
  owners:
    - "Direct Supervisor"
    - "Human Resources"
