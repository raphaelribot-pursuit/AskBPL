# render.yaml — Ask BPL Production Blueprint
# Generated by Render plugin for VizionScop3 LLC
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance → Connect this repo

databases:
  - name: askbpl-db
    plan: starter  # $7/mo, 1GB storage, 97 connections — upgrade to standard for HA
    databaseName: askbpl
    user: askbpl
    region: ohio  # us-east
    postgresMajorVersion: "16"

services:
  # ─────────────────────────────────────────────────────────────────────
  # FastAPI Orchestrator — main RAG API serving Claude + Pinecone queries
  # ─────────────────────────────────────────────────────────────────────
  - type: web
    name: askbpl-orchestrator
    runtime: python
    region: ohio
    plan: starter  # $7/mo — upgrade to standard for autoscaling
    rootDir: packages/orchestrator
    buildCommand: pip install -e .
    startCommand: uvicorn ask_bpl_orchestrator.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Database — wired from Render Postgres
      - key: DATABASE_URL
        fromDatabase:
          name: askbpl-db
          property: connectionString
        # Render provides postgres:// but asyncpg needs postgresql+asyncpg://
        # Handle in app code or use sync driver for migrations

      # Auth secrets — generate secure values
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256

      # Admin console auth
      - key: ADMIN_BASIC_USER
        value: vizion_build
      - key: ADMIN_BASIC_PASSWORD
        generateValue: true

      # Pilot demo (set real values in Render Dashboard after deploy)
      - key: PILOT_DEMO_EMAIL
        value: pilot-demo@bklynlibrary.org
      - key: PILOT_DEMO_ACCESS_CODE
        sync: false  # Set manually in Dashboard — never in YAML

      # AI API keys — set in Dashboard after deploy
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6

      # Pinecone vector store
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: askbpl-pilot
      - key: PINECONE_HOST
        sync: false
      - key: PINECONE_TOP_K
        value: "6"

      # RAG tuning
      - key: GROUNDING_THRESHOLD
        value: "0.40"
      - key: SEED_AUTO_APPROVE_ROUTING
        value: "0"  # Disable auto-approve in production

      # CORS — include your Vercel frontend URL
      - key: CORS_ORIGINS
        value: https://askbpl-web-demo.vercel.app,https://askbpl.bklynlibrary.org

      # Python settings
      - key: PYTHONUNBUFFERED
        value: "1"

    autoDeploy: true  # Deploys on push to main
