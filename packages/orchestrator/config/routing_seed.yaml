policy_types:
  - slug: gift_acceptance
    display_name: Gift Acceptance Policy
    description: Rules for accepting donor gifts.

  - slug: fundraising_policy
    display_name: Fundraising Policy
    description: Institutional fundraising norms.

  - slug: data_retention
    display_name: Data Retention
    description: How long organizational data is retained.

  - slug: generic_policy
    display_name: Sample Policy Bucket
    description: Fallback sample policy corpus for ingest smoke tests.

  # BPL pilot PDF corpus (mirrors askbpl/config/routing.yaml — Selvon approval pending)
  - slug: materials_selection
    display_name: Materials Selection Policy
    description: Criteria and process for library materials selection.

  - slug: unattended_children
    display_name: Policy on Unattended Children
    description: Safety and conduct standards for unattended children in library branches.

  - slug: annual_leave
    display_name: Annual Leave Policy
    description: Employee annual leave entitlements and procedures.

  - slug: conflict_of_interest
    display_name: Conflicts of Interest and Disclosure Policy
    description: Disclosure requirements and conflict-of-interest standards.

  - slug: fundraising
    display_name: Fundraising Policy
    description: BPL institutional fundraising guidelines (PDF corpus).

  - slug: volunteer_manual
    display_name: Volunteer Manual and Policy
    description: Volunteer roles, expectations, and library policies.

  # Added for demo day — pending formal TRD-RTG-4 sign-off
  - slug: technology_use
    display_name: Technology Use (Public)
    description: IV. Public 1 — covers patron computer access, CIPA filtering, Wi-Fi.

  # Added for demo day — pending formal TRD-RTG-4 sign-off
  - slug: technology_usage_policy
    display_name: Technology Usage Policy
    description: HR12 — covers staff acceptable use of computers, email, internet, voicemail.

  # Wave 1 of the 21 unevaluated documents (patch 0029, docs/CORPUS_WAVES.md). Slugs and routing are PROPOSED, not approved:
  # `askbpl-seed` stores every rule as unapproved (SEED_AUTO_APPROVE_ROUTING=0), and an unapproved rule is never shown,
  # so staff get the neutral supervisor referral until BPL approves a team (RTG-3, RTG-4, RTG-7). No team was invented:
  # each rule uses a team that already exists in this file. Where the policy names no existing team, SUPERVISOR is used.
  - slug: policy_management
    display_name: Policy for Policy Management
    description: How BPL policies are drafted, approved, issued and reviewed (April 2026).

  - slug: collection_maintenance
    display_name: Collection Maintenance Procedures
    description: Evaluating, replacing and withdrawing circulating materials (updated January 2026).

  - slug: internal_communications
    display_name: Internal Communications Policy
    description: Staff tools and norms for email, chat, video and other internal communication.

  - slug: promotional_marketing
    display_name: Promotional and Marketing Materials Policy
    description: How printed and electronic promotional materials are requested and produced.

  - slug: dress_code
    display_name: Dress Code Policy
    description: HR09. Workplace dress expectations for staff.

  - slug: custodianship
    display_name: Custodianship of Library Materials Policy
    description: Staff responsibility for safeguarding library materials and using the library system.

  - slug: social_media
    display_name: Social Media Use Policy
    description: Staff use of social platforms for BPL and personal accounts.

