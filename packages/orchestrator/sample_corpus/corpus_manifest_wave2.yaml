    title: Whistle-Blower Protection Policy
    version: "2009-10"

  # SRC-24. HR14, issued October 2006, effective June 2006. Separates union and non-union staff; the union contract is not in the corpus.
  - path: "14 - Progressive Discipline Policy (06.06).pdf"
    policy: progressive_discipline
    title: Progressive Discipline Policy
    version: "2006-06"

  # SRC-26. HR25, issued October 2006, effective June 2006. A legal entitlement from 2006: never compute current entitlements from it.
  # NOTE: the file name has two spaces before "(06.06)". Keep them.
  - path: "25 - Family and Medical Leave Act  (06.06).pdf"
    policy: fmla
    title: Family and Medical Leave Act Policy
    version: "2006-06"
