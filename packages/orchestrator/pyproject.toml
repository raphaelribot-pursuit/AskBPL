[project]
name = "ask-bpl-orchestrator"
version = "0.1.0"
description = "Ask BPL pilot Python orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "openai>=1.59.0",
    "anthropic>=0.42.0",
    "pinecone>=5.0.0",
    "langchain-openai>=0.2.14",
    "langchain-core>=0.3.28",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "pyyaml>=6.0.2",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "Pillow>=10.0.0",
]

[project.scripts]
askbpl-ingest = "ask_bpl_orchestrator.ingest.cli:main"
askbpl-ingest-batch = "ask_bpl_orchestrator.ingest.batch:main"
askbpl-seed = "ask_bpl_orchestrator.seed:main"
askbpl-latency-smoke = "ask_bpl_orchestrator.latency_report:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ask_bpl_orchestrator*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
